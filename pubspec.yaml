name: magic_devtools
description: "Wire a Magic app into tapir (E2E driver) and crumbs (runtime inspector): Magic-aware snapshots, records, perf tracing and previews, tree-shaken from release builds."
version: 1.0.1
homepage: https://anilcancakir.com/magic/devtools
repository: https://github.com/anilcancakir/magic_devtools
issue_tracker: https://github.com/anilcancakir/magic_devtools/issues

topics:
  - devtools
  - debugging
  - testing
  - observability
  - magic

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  magic: ^1.0.0
  magic_socket: ^1.0.0
  tapir: ^1.0.0
  crumbs: ^1.0.0
  material_ui: ^1.11.0
  wind_kit: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
