name: magic_devtools
description: "Magic adapters for the tapir and crumbs dev tools: wires MagicTapirIntegration and MagicCrumbsIntegration into tapir and crumbs."
version: 1.0.0
homepage: https://magic.fluttersdk.com
repository: https://github.com/fluttersdk/magic_devtools
issue_tracker: https://github.com/fluttersdk/magic_devtools/issues

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  magic: ^1.0.0
  magic_socket: ^1.0.0
  tapir: ^1.0.0
  crumbs: ^1.0.0
  material_ui: ^1.11.0
  wind_kit: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
